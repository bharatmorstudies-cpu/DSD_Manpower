{% extends "base.html" %}
{% block content %}
<style>
    .form-card {
        max-width: 600px;
        margin: 40px auto;
        background: white;
        padding: 45px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        border: 1px solid #e2e8f0;
    }
    .form-card h3 {
        font-size: 26px;
        font-weight: 800;
        color: #0f172a;
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
    }
    .input-group {
        margin-bottom: 20px;
    }
    .input-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
        color: #475569;
    }
    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
        color: #0f172a;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }
    .form-control:focus {
        outline: none;
        border-color: #2563eb;
    }
    .submit-btn {
        background-color: #0f172a;
        color: white;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }
    .submit-btn:hover {
        background-color: #1e293b;
    }
</style>

<div class="form-card">
    <h3>Procurement & Staffing Request</h3>
    <form method="POST">
        <div class="input-group">
            <label>Corporate Entity / Client Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Bharat Enterprise Ltd" required>
        </div>
        <div class="input-group">
            <label>Official Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="e.g. contact@company.com" required>
        </div>
        <div class="input-group">
            <label>Deployment Profile Selection</label>
            <select name="service_type" class="form-control">
                <option value="Elite Bouncers">Elite Bouncers & Executive Security</option>
                <option value="Corporate Housekeeping">Corporate Housekeeping Asset Force</option>
            </select>
        </div>
        <div class="input-group">
            <label>Required Force Size Count</label>
            <input type="number" name="staff_count" class="form-control" min="1" value="1" required>
        </div>
        <div class="input-group">
            <label>Operational Directives / Shift Details</label>
            <textarea name="details" class="form-control" rows="4" placeholder="Specify tactical parameters, access configurations or timeline schedules..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit Formal Procurement Request</button>
    </form>
</div>
{% endblock %}
