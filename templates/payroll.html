{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 bg-white p-4 rounded shadow">
        <h3 class="mb-3 text-center">Staff Payroll Calculator</h3>
        <form method="POST">
            <div class="mb-3"><label class="form-label">Employee Name</label><input type="text" name="staff_name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Hourly Rate</label><input type="number" step="0.01" name="hourly_rate" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Hours Worked</label><input type="number" step="0.1" name="hours_worked" class="form-control" required></div>
            <button type="submit" class="btn btn-dark w-100">Calculate Pay</button>
        </form>
        {% if result %}
        <div class="mt-4 p-3 bg-light border rounded text-center">
            <h5>Statement for: <strong>{{ result.staff_name }}</strong></h5>
            <h4 class="text-success">Gross Pay: {{ result.gross_pay }}</h4>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
