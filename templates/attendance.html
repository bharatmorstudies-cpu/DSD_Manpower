{% extends "base.html" %}
{% block content %}
<style>
    .mobile-card { max-width: 450px; margin: 40px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; text-align: center; }
    .mobile-card h3 { font-size: 24px; font-weight: 800; color: #0f172a; margin: 0 0 10px 0; }
    .status-select { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
    .status-btn { padding: 15px; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.2s; background: none; }
    .checkin-radio:checked + .status-btn { border-color: #10b981; color: #10b981; background-color: #ecfdf5; }
    .checkout-radio:checked + .status-btn { border-color: #ef4444; color: #ef4444; background-color: #fef2f2; }
    .form-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; }
    .action-submit { background-color: #0f172a; color: white; width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
<div class="mobile-card">
    <h3>Staff Attendance Terminal</h3>
    <p style="color: #64748b; font-size: 14px; margin-top: 0;">Select assignment activity parameters below.</p>
    <form method="POST">
        <input type="text" name="staff_name" class="form-input" placeholder="Enter Full Employee Name" required>
        <input type="text" name="location_tag" class="form-input" placeholder="Deployment Site / Client Location" required>
        <div class="status-select">
            <label>
                <input type="radio" name="action_type" value="Check-In" class="checkin-radio" style="display:none;" checked>
                <div class="status-btn">🟢 CHECK IN</div>
            </label>
            <label>
                <input type="radio" name="action_type" value="Check-Out" class="checkout-radio" style="display:none;">
                <div class="status-btn">🔴 CHECK OUT</div>
            </label>
        </div>
        <button type="submit" class="action-submit">Transmit Punch Log</button>
    </form>
</div>
{% endblock %}
