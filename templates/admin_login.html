{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 bg-white p-4 rounded shadow text-center">
        <h3 class="mb-3">🔐 Management Portal</h3>
        <form method="POST">
            <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Security Password" required></div>
            <button type="submit" class="btn-primary w-100">Unlock Dashboard</button>
        </form>
    </div>
</div>
{% endblock %}
